# CI — push/PR бүрд төрөл, lint, нэгж тест, production build, хамаарлын аудит.
#
# DB integration тестүүд (org-isolation, ai-tools-flow, procurement-flow,
# simulation-regressions …) нь job-ын ТҮР Postgres service дээр ҮРГЭЛЖ явна:
# хоосон DB-д `db:predeploy` (production-ий preDeploy-той ИЖИЛ) схем үүсгэнэ.
# Урьд нь DATABASE_URL secret-гүй үед энэ алхам чимээгүй алгасагддаг байсан тул
# PR #79-ийн DB регресс тестүүд CI-д огт ажиллаагүй (аудит M).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Next.js-ийн build кэш — дараагийн ажиллалтад build мэдэгдэхүйц
      # хурдасна. Кэш олдохгүй бол бүтэн build явна (алдаа болохгүй).
      # `npm ci`-ийн ӨМНӨ: node_modules суусны дараа бол түлхүүрийн hashFiles
      # хэдэн арван мянган файл хэшлэх болно.
      - name: Build кэш
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Хамаарал суулгах
        run: npm ci

      # next-env.d.ts нь gitignore-д тул CI-д гараар үүсгэнэ (tsc-д хэрэгтэй).
      - name: Next.js төрлийн лавлагаа
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Төрлийн шалгалт (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npx eslint .

      - name: Нэгж тест (DB шаардахгүй)
        run: npx tsx --test $(ls tests/*.test.ts | grep -v -e org-isolation -e ai-tools-flow -e procurement-flow -e ai-logging-isolation -e simulation-regressions -e credit-note-flow -e sim2-regressions -e opening-stock-flow -e po-short-close-flow)

      # Railway-ийн deploy ЯГ энэ командаар build хийдэг. tsc нь client/server
      # хилийн алдааг ТАНИХГҮЙ: "use client" component нь server-only модуль
      # (жишээ нь @/lib/db → postgres драйвер) импортлоход төрөл нь зөв атлаа
      # bundler `Can't resolve 'fs'` гэж унадаг. 2026-09-19-нд яг ийм алдаа CI-г
      # давж, production-ийн 3 deploy дараалан унасан тул энэ алхам нэмэгдэв.
      - name: Build (next build — client/server хилийн шалгалт)
        run: npx next build

      # DATABASE_URL зөвхөн эдгээр алхамд — build нь DB-гүй хэвээр (production
      # build-тэй ижил). Файлууд нэг DB хуваалцдаг тул дараалан (concurrency 1).
      - name: DB схем (хоосон Postgres дээр preDeploy)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/entry_ci
        run: npm run db:predeploy

      - name: DB integration тест
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/entry_ci
          AUTH_SECRET: ci-only-auth-secret-not-used-in-production
        run: npx tsx --test --test-concurrency=1 tests/org-isolation.test.ts tests/ai-tools-flow.test.ts tests/procurement-flow.test.ts tests/ai-logging-isolation.test.ts tests/simulation-regressions.test.ts tests/inventory-master-data-flow.test.ts tests/org-purge.test.ts tests/credit-note-flow.test.ts tests/sim2-regressions.test.ts tests/opening-stock-flow.test.ts tests/skills-plan-flow.test.ts tests/po-short-close-flow.test.ts

      - name: Хамаарлын аудит
        run: npm audit --audit-level=high
