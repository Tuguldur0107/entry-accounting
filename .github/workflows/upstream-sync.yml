# Upstream sync — ХАРИЛЦАГЧИЙН repo дээр ажиллана: core repo
# (Tuguldur0107/entry-accounting)-ийн шинэ хувилбарыг татаж `upstream-sync/<ref>`
# салбар үүсгээд харилцагчийн main руу PR нээнэ. Merge conflict гарвал PR
# дээр харагдана — custom/ дотор л ажилласан бол conflict гарахгүй
# (docs/deployment/README.md §3).
#
# Харилцагчийн repo = GitHub "Fork" товч ЭСВЭЛ гараар үүсгэсэн repo (core
# private тул ихэвчлэн гараар: `git push --mirror`) — хоёуланд ажиллана.
#
# Харилцагчийн repo дээр нэг удаа тохируулах:
#   Settings → Actions → General → Workflow permissions:
#     ✓ Read and write permissions
#     ✓ Allow GitHub Actions to create and approve pull requests
#   Settings → Secrets → Actions → UPSTREAM_TOKEN:
#     core repo-г УНШИХ эрхтэй fine-grained PAT (Contents: Read) — core
#     private байх үед заавал; core public болбол хэрэггүй.
#
# Core repo дээр энэ workflow юу ч хийхгүй (if-шалгалт).
name: Upstream sync

on:
  schedule:
    - cron: "0 2 * * 1" # Даваа гараг бүр 02:00 UTC (10:00 УБ)
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref (tag vX.Y.Z эсвэл main)"
        required: false
        default: "main"

env:
  UPSTREAM_REPO: Tuguldur0107/entry-accounting

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Core repo дээр ажиллахгүй (contains нь том/жижиг үсэг ялгахгүй).
    if: ${{ !contains(github.repository, 'tuguldur0107/entry-accounting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upstream татах
        id: fetch
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          REF="${{ github.event.inputs.ref || 'main' }}"
          if [ -n "$UPSTREAM_TOKEN" ]; then
            git remote add upstream "https://x-access-token:${UPSTREAM_TOKEN}@github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch upstream --tags "$REF"
          SHA="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork аль хэдийн $REF ($SHA)-ийг агуулж байна — хийх зүйлгүй"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          SAFE="$(echo "$REF" | tr '/' '-')"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "branch=upstream-sync/$SAFE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Sync салбар push хийх
        if: steps.fetch.outputs.up_to_date == 'false'
        run: |
          git push --force origin "${{ steps.fetch.outputs.sha }}:refs/heads/${{ steps.fetch.outputs.branch }}"

      # GITHUB_TOKEN-оор нээсэн PR дээр CI ажилладаггүй тул merge-ийн үр дүнг ЭНД
      # шалгана: түр merge → tsc, lint, нэгж тест. Үр дүн нь PR-ийн label болно —
      # Entry Console «авто sync» нь sync-checks-passed label-тэй PR-ыг л merge хийнэ.
      - name: Merge туршилт + шалгалт (tsc, lint, тест)
        if: steps.fetch.outputs.up_to_date == 'false'
        id: checks
        continue-on-error: true
        run: |
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          if ! git merge --no-ff --no-edit "${{ steps.fetch.outputs.sha }}"; then
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi
          npm ci
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          if npx tsc --noEmit && npx eslint . && npx tsx --test $(ls tests/*.test.ts | grep -v -e org-isolation -e ai-tools-flow); then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          git reset --hard HEAD~1 >/dev/null 2>&1 || true

      - name: PR нээх (байхгүй бол)
        if: steps.fetch.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.fetch.outputs.branch }}"
          REF="${{ steps.fetch.outputs.ref }}"
          RESULT="${{ steps.checks.outputs.result || 'unknown' }}"
          case "$RESULT" in
            passed)   LABEL="sync-checks-passed";  COLOR="0e8a16"; DESC="Merge туршилт + tsc/lint/test давсан — авто merge болно" ;;
            failed)   LABEL="sync-checks-failed";  COLOR="d93f0b"; DESC="Merge туршилтын шалгалт унасан — гараар шалгана" ;;
            conflict) LABEL="sync-conflict";       COLOR="b60205"; DESC="Merge conflict — гараар шийднэ" ;;
            *)        LABEL="sync-checks-unknown"; COLOR="cccccc"; DESC="Шалгалт ажиллаагүй" ;;
          esac
          for L in sync-checks-passed sync-checks-failed sync-conflict sync-checks-unknown; do
            gh label create "$L" --force --color "$([ "$L" = "$LABEL" ] && echo "$COLOR" || echo cccccc)" --description "upstream-sync" >/dev/null 2>&1 || true
          done
          EXISTING="$(gh pr list --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --remove-label sync-checks-passed,sync-checks-failed,sync-conflict,sync-checks-unknown >/dev/null 2>&1 || true
            gh pr edit "$EXISTING" --add-label "$LABEL"
            echo "PR #$EXISTING аль хэдийн нээлттэй — шинэчлэгдлээ ($LABEL)"
            exit 0
          fi
          gh pr create \
            --label "$LABEL" \
            --head "$BRANCH" \
            --base "${{ github.event.repository.default_branch }}" \
            --title "Upstream sync: ${REF}" \
            --body "$(printf '%s\n' \
              "Core repo \`${UPSTREAM_REPO}\`-ийн \`${REF}\` (\`${{ steps.fetch.outputs.sha }}\`) шинэчлэлт." \
              "" \
              "**Шалгалт (энэ workflow дотор merge туршиж ажиллуулсан):** \`${RESULT}\` — ${DESC}" \
              "" \
              "**Шалгах:**" \
              "- [ ] Conflict байвал \`custom/\` талаас биш core талаас ирсэн эсэхийг шалга (core файлыг өөрчилсөн бол custom/ руу нүүлгэ)" \
              "- [ ] Staging дээр deploy хийж \`/api/health\` version шалга" \
              "- [ ] Шинэ DDL байвал \`npm run db:push\` (Railway preDeployCommand автоматаар)" \
              "" \
              "Заавар: docs/deployment/README.md")"
